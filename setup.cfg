[metadata]
name = two_stream_dvd

description = Repository for the Two stream dvd approach.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/KietzmannLab/two_stream_dvd
author = Benito Manocchio
author_email = bmanocchio@uni-osnabrueck.de
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Image Processing
project_urls =
    Bug Tracker = https://github.com/KietzmannLab/two_stream_dvd/issues
    Documentation = https://github.com/KietzmannLab/two_stream_dvd#README.md
    Source Code = https://github.com/KietzmannLab/two_stream_dvd
    User Support = https://github.com/KietzmannLab/two_stream_dvd/issues

[options]
packages = find:
install_requires =
    colour-science
    notebook
    ipykernel
    lightly
    psutil
    torch
    torchvision
    numpy
    hydra-core
    lightning_kietzmannlab@git+https://github.com/KietzmannLab/lightning-kietzmannlab.git
    # DVD@git+https://github.com/KietzmannLab/DVD.git@dvd_scale_free
    neuroai@git+https://github.com/KietzmannLab/Neuro-vs-AI.git
    nsd_visuo_semantics@git+https://github.com/KietzmannLab/nsd_visuo_semantics.git

python_requires = >=3.8
include_package_data = True
package_dir =
    =src
setup_requires = setuptools_scm
# add your package requirements here

[options.packages.find]
where = src

[options.entry_points]
kietzmannlab.manifest =
    two_stream_dvd = two_stream_dvd:kietzmannlab.yaml

[options.extras_require]
testing =
    tox
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/


[options.package_data]
* = *.yaml
